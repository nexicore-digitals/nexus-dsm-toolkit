name: Publish to JSR
on:
    push:
        branches:
            - "release/v*"

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
              name: Checkout repository
            - name: Publish package
              run: npx jsr publish
